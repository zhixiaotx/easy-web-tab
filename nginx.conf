# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen       80;
        listen       [::]:80;
        server_name  www.codehelp.com.cn;          # 绑定域名
	location / {
	        proxy_pass http://localhost:16718;   # 指向主机服务 
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
    }

    server {
    	listen 16718;
	server_name localhost;
	location / {
		root /usr/share/nginx/html/dist;
		index index.html index.htm;
                try_files $uri $uri/ /index.html;
		add_header 'Access-Control-Allow-Origin' '*';
		add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS';
		add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Request-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
	
	}

	# ===== 同源后端代理：POST 接口反代到 Node 服务 =====
	# 不加这段时，POST /api/* 会落到上面静态 location → Nginx 静态模块拒绝 POST → 405
	# `=` 精确匹配优先级最高，会先于 location / 和静态后缀正则命中
	location = /api/fetch-meta {
		proxy_pass http://127.0.0.1:16720;      # scripts/fetch-meta-only.cjs
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 10s;
		proxy_read_timeout 30s;                  # 抓元数据较慢，需放宽
	}

	location = /api/webdav-proxy {
		proxy_pass http://127.0.0.1:16719;      # scripts/webdav-proxy-only.cjs
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 10s;
		proxy_read_timeout 30s;
	}

	# 可选：静态资源缓存
	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
	        expires 1y;
		add_header Cache-Control "public, immutable";
	}
	 server_tokens off;
    }
