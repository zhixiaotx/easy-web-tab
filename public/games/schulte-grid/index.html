<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舒尔特方格 - 注意力训练</title>
    <style>
        /* 舒尔特方格 - 游戏化样式 */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #475569;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at top, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
        }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .main-layout { display: flex; gap: 20px; align-items: flex-start; }
        
        .sidebar-left { width: 220px; flex-shrink: 0; }
        .sidebar-right { width: 280px; flex-shrink: 0; }
        .center-area { flex: 1; min-width: 0; }
        
        .header { text-align: center; padding: 30px 0; }
        
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .subtitle { color: var(--text-muted); font-size: 1rem; }
        
        .controls-vertical {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            background: var(--bg-card);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .controls-vertical .control-group label { font-size: 0.75rem; margin-bottom: 4px; }
        .controls-vertical .control-group select { padding: 8px 10px; font-size: 0.85rem; }
        
        .control-group { flex: 1; }
        
        .control-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 8px;
        }
        
        .control-group select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .control-group select:hover { border-color: var(--primary); }
        
        .control-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        
        .game-area {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        
        .info-bar {
            display: flex;
            justify-content: space-around;
            margin-top: 16px;
            padding: 12px;
            background: var(--bg);
            border-radius: 12px;
        }
        
        .stat { text-align: center; }
        
        .stat .label {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }
        
        .stat .value {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'SF Mono', 'Consolas', monospace;
        }
        
        .stat .value#timer { color: var(--primary); }
        .stat .value#currentNum { color: var(--success); }
        .stat .value#errors { color: var(--danger); }
        
        .grid-container {
            display: grid;
            gap: 8px;
            margin: 20px 0;
            aspect-ratio: 1;
            max-height: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .grid-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        
        .grid-cell:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
            transform: scale(1.02);
        }
        
        .grid-cell:active { transform: scale(0.98); }
        
        .grid-cell.correct {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
            color: var(--success);
        }
        
        .grid-cell.wrong {
            animation: shake 0.3s ease;
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
        }
        
        .grid-cell.current {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }
        
        .grid-cell.completed { opacity: 0.5; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .grid-cell.pop { animation: pop 0.3s ease; }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }
        
        .btn-primary:active { transform: translateY(0); }
        
        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover { background: var(--bg-hover); }
        
        .btn-small {
            padding: 8px 16px;
            font-size: 0.875rem;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        
        .btn-small:hover { color: var(--danger); border-color: var(--danger); }
        
        .results-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            text-align: center;
            animation: slideIn 0.3s ease;
        }
        
        .results-section h2 {
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 1rem;
        }
        
        .result-cards {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .result-card {
            background: var(--bg);
            padding: 10px 14px;
            border-radius: 8px;
            min-width: 70px;
        }
        
        .result-label {
            display: block;
            color: var(--text-muted);
            font-size: 0.65rem;
            margin-bottom: 2px;
        }
        
        .result-value { font-size: 1rem; font-weight: 700; }
        
        #resultRating { color: var(--warning); }
        
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            animation: bounce 0.5s ease;
        }
        
        .badge.gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1e293b;
        }
        
        .badge.silver {
            background: linear-gradient(135deg, #94a3b8, #64748b);
            color: #1e293b;
        }
        
        .badge.bronze {
            background: linear-gradient(135deg, #cd7f32, #a0522d);
            color: #1e293b;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .history-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
        }
        
        .history-section h2 {
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 1.25rem;
        }
        
        .history-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 16px;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        
        .history-item:hover { background: var(--bg-hover); }
        
        .history-info { display: flex; gap: 16px; align-items: center; }
        .history-size { color: var(--primary); font-weight: 600; }
        .history-time { color: var(--text-muted); font-family: 'SF Mono', monospace; }
        .history-errors { color: var(--danger); font-size: 0.875rem; }
        
        .history-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
        
        .guide {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
        }
        
        .guide .intro {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        
        .guide h3 { margin-bottom: 12px; color: var(--text-muted); }
        
        .guide ol {
            padding-left: 20px;
            color: var(--text-muted);
            line-height: 1.8;
        }
        
        @media (max-width: 1100px) {
            .main-layout { flex-wrap: wrap; }
            .sidebar-left, .sidebar-right { width: 100%; }
            .center-area { width: 100%; order: -1; }
        }
        
        @media (max-width: 600px) {
            .container { padding: 12px; }
            .header h1 { font-size: 1.75rem; }
            .controls { flex-direction: column; }
            .result-cards { flex-direction: column; gap: 12px; }
            .grid-cell { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎯 舒尔特方格</h1>
        </header>

        <div class="main-layout">
            <div class="sidebar-left">
                <div class="controls-vertical">
                    <div class="control-group">
                        <label>方格规格</label>
                        <select id="gridSize">
                            <option value="3">3 × 3</option>
                            <option value="4">4 × 4</option>
                            <option value="5" selected>5 × 5</option>
                            <option value="6">6 × 6</option>
                            <option value="7">7 × 7</option>
                            <option value="10">10 × 10</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>训练模式</label>
                        <select id="gameMode">
                            <option value="number" selected>数字模式</option>
                            <option value="letter">字母模式</option>
                            <option value="reverse">反向模式</option>
                        </select>
                    </div>
                </div>

                <div class="guide">
                    <h3>📖 使用说明</h3>
                    <p class="intro">注意力训练利器</p>
                    <ol>
                        <li>选择方格规格和训练模式</li>
                        <li>点击"开始训练"按钮</li>
                        <li>按顺序点击数字（1→2→3...），尽量用余光观察</li>
                        <li>保持目光固定在方格中心</li>
                        <li>完成后查看成绩和历史记录</li>
                    </ol>
                </div>
            </div>

            <div class="center-area">
                <div class="game-area">
                    <div class="grid-container" id="gridContainer">
                        <!-- Grid will be generated here -->
                    </div>

                    <div class="action-buttons">
                        <button id="startBtn" class="btn btn-primary">开始训练</button>
                        <button id="resetBtn" class="btn btn-secondary">重置</button>
                    </div>

                    <div class="info-bar" id="infoBar" style="display: none;">
                        <div class="stat">
                            <span class="label">时间</span>
                            <span class="value" id="timer">00:00.000</span>
                        </div>
                        <div class="stat">
                            <span class="label">当前</span>
                            <span class="value" id="currentNum">0</span>
                        </div>
                        <div class="stat">
                            <span class="label">错误</span>
                            <span class="value" id="errors">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar-right">
                <div class="results-section" id="resultsSection">
                    <h2>🏆 本次成绩</h2>
                    <div class="result-cards">
                        <div class="result-card">
                            <span class="result-label">用时</span>
                            <span class="result-value" id="resultTime">--</span>
                        </div>
                        <div class="result-card">
                            <span class="result-label">错误</span>
                            <span class="result-value" id="resultErrors">--</span>
                        </div>
                        <div class="result-card">
                            <span class="result-label">评级</span>
                            <span class="result-value" id="resultRating">--</span>
                        </div>
                    </div>
                    <div class="badge" id="resultBadge" style="display: none;"></div>
                </div>

                <div class="history-section">
                    <h2>📊 历史记录</h2>
                    <div class="history-list" id="historyList">
                        <!-- History items will be inserted here -->
                    </div>
                    <button id="clearHistory" class="btn btn-small">清空记录</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 舒尔特方格 - 核心逻辑
         */

        // 游戏状态
        const state = {
            gridSize: 5,
            mode: 'number',
            isPlaying: false,
            currentNumber: 1,
            totalNumbers: 25,
            errors: 0,
            startTime: 0,
            timerInterval: null,
            history: [],
            letters: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
        };

        // DOM 元素
        const elements = {
            gridSize: document.getElementById('gridSize'),
            gameMode: document.getElementById('gameMode'),
            timer: document.getElementById('timer'),
            currentNum: document.getElementById('currentNum'),
            errors: document.getElementById('errors'),
            gridContainer: document.getElementById('gridContainer'),
            startBtn: document.getElementById('startBtn'),
            resetBtn: document.getElementById('resetBtn'),
            resultsSection: document.getElementById('resultsSection'),
            resultTime: document.getElementById('resultTime'),
            resultErrors: document.getElementById('resultErrors'),
            resultRating: document.getElementById('resultRating'),
            resultBadge: document.getElementById('resultBadge'),
            historyList: document.getElementById('historyList'),
            clearHistory: document.getElementById('clearHistory'),
            infoBar: document.getElementById('infoBar')
        };

        // 初始化
        function init() {
            loadHistory();
            setupEventListeners();
            renderGrid();
            updateHistoryDisplay();
        }

        // 事件监听
        function setupEventListeners() {
            elements.gridSize.addEventListener('change', (e) => {
                state.gridSize = parseInt(e.target.value);
                state.totalNumbers = state.gridSize * state.gridSize;
                renderGrid();
                resetGame();
            });

            elements.gameMode.addEventListener('change', (e) => {
                state.mode = e.target.value;
                renderGrid();
                resetGame();
            });

            elements.startBtn.addEventListener('click', startGame);
            elements.resetBtn.addEventListener('click', resetGame);
            elements.clearHistory.addEventListener('click', clearHistory);
        }

        // 生成随机方格
        function generateGrid(size, mode) {
            const total = size * size;
            let items;

            if (mode === 'letter') {
                // 字母模式
                items = state.letters.substring(0, total).split('');
            } else if (mode === 'reverse') {
                // 反向模式 - 从大到小
                items = Array.from({ length: total }, (_, i) => total - i);
            } else {
                // 数字模式（默认）
                items = Array.from({ length: total }, (_, i) => i + 1);
            }

            // Fisher-Yates 洗牌
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }

            // 转换为二维数组
            const grid = [];
            for (let i = 0; i < size; i++) {
                grid.push(items.slice(i * size, (i + 1) * size));
            }

            return grid;
        }

        // 渲染方格
        function renderGrid() {
            const grid = generateGrid(state.gridSize, state.mode);
            elements.gridContainer.style.gridTemplateColumns = `repeat(${state.gridSize}, 1fr)`;
            elements.gridContainer.innerHTML = '';

            grid.forEach((row, rowIndex) => {
                row.forEach((value, colIndex) => {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.textContent = value;
                    cell.dataset.row = rowIndex;
                    cell.dataset.col = colIndex;
                    cell.dataset.value = value;
                    cell.addEventListener('click', handleCellClick);
                    elements.gridContainer.appendChild(cell);
                });
            });
        }

        // 处理点击
        function handleCellClick(e) {
            if (!state.isPlaying) return;

            const cell = e.target;
            const value = parseInt(cell.dataset.value) || cell.dataset.value;
            const expected = state.mode === 'reverse' 
                ? (state.totalNumbers - state.currentNumber + 1)
                : state.currentNumber;

            // 判断点击是否正确
            let isCorrect = false;
            if (state.mode === 'letter') {
                const currentLetter = state.letters[state.currentNumber - 1];
                isCorrect = value === currentLetter;
            } else {
                isCorrect = value === expected;
            }

            if (isCorrect) {
                // 正确点击
                cell.classList.add('correct', 'pop');
                setTimeout(() => cell.classList.remove('pop'), 300);
                
                // 更新当前数字
                state.currentNumber++;
                updateCurrentDisplay();
                
                // 检查是否完成
                if (state.currentNumber > state.totalNumbers) {
                    endGame();
                }
            } else {
                // 错误点击
                state.errors++;
                cell.classList.add('wrong');
                setTimeout(() => cell.classList.remove('wrong'), 300);
                updateErrorsDisplay();
            }
        }

        // 高亮当前需要点击的数字
        function highlightCurrent() {
            const cells = document.querySelectorAll('.grid-cell');
            cells.forEach(cell => {
                cell.classList.remove('current');
                const value = parseInt(cell.dataset.value) || cell.dataset.value;
                
                let targetValue;
                if (state.mode === 'letter') {
                    targetValue = state.letters[state.currentNumber - 1];
                } else if (state.mode === 'reverse') {
                    targetValue = state.totalNumbers - state.currentNumber + 1;
                } else {
                    targetValue = state.currentNumber;
                }
                
                if (value === targetValue) {
                    cell.classList.add('current');
                }
            });
        }

        // 开始游戏
        function startGame() {
            // 如果游戏正在进行中，不执行
            if (state.isPlaying) return;
            
            // 每次开始都重置方格，避免作弊
            renderGrid();
            
            state.isPlaying = true;
            state.currentNumber = 1;
            state.errors = 0;
            state.startTime = Date.now();
            
            // 隐藏infoBar（后台计时，不显示）
            elements.infoBar.style.display = 'none';
            
            // 不隐藏resultsSection，保留上次成绩
            
            // 更新按钮状态
            elements.startBtn.textContent = '进行中...';
            elements.startBtn.disabled = true;
            
            // 重置显示
            updateCurrentDisplay();
            updateErrorsDisplay();
            
            // 启动计时器
            state.timerInterval = setInterval(updateTimer, 10);
        }

        // 结束游戏
        function endGame() {
            state.isPlaying = false;
            clearInterval(state.timerInterval);
            
            const elapsed = Date.now() - state.startTime;
            const timeStr = formatTime(elapsed);
            
            // 显示结果
            showResults(timeStr, state.errors, elapsed);
            
            // 保存历史记录
            saveHistory(timeStr, state.errors, elapsed);
            
            // 更新按钮
            elements.startBtn.textContent = '开始训练';
            elements.startBtn.disabled = false;
        }

        // 重置游戏
        function resetGame() {
            state.isPlaying = false;
            state.currentNumber = 1;
            state.errors = 0;
            clearInterval(state.timerInterval);
            
            // 隐藏infoBar
            elements.infoBar.style.display = 'none';
            
            // 重置显示
            elements.timer.textContent = '00:00.000';
            elements.currentNum.textContent = '0';
            elements.errors.textContent = '0';
            elements.startBtn.textContent = '开始训练';
            elements.startBtn.disabled = false;
            // 不隐藏resultsSection，保留成绩
            
            // 重新渲染方格
            renderGrid();
        }

        // 显示结果
        function showResults(time, errors, elapsedMs) {
            elements.resultTime.textContent = time;
            elements.resultErrors.textContent = errors;
            
            // 计算评级
            const rating = getRating(elapsedMs, errors);
            elements.resultRating.textContent = rating.label;
            elements.resultRating.style.color = rating.color;
            
            // 显示徽章
            if (rating.badge) {
                elements.resultBadge.textContent = rating.badge;
                elements.resultBadge.className = 'badge ' + rating.badgeClass;
                elements.resultBadge.style.display = 'inline-block';
            } else {
                elements.resultBadge.style.display = 'none';
            }
            
            elements.resultsSection.style.display = 'block';
            elements.resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        // 获取评级
        function getRating(elapsedMs, errors) {
            const seconds = elapsedMs / 1000;
            const baseScore = seconds + errors * 2;
            
            // 5×5方格评级标准
            const standards = {
                '5': { excellent: 12, good: 20, average: 30 },
                '4': { excellent: 8, good: 15, average: 22 },
                '3': { excellent: 5, good: 10, average: 15 },
                '6': { excellent: 20, good: 35, average: 50 },
                '7': { excellent: 30, good: 50, average: 70 },
                '10': { excellent: 60, good: 90, average: 120 }
            };
            
            const std = standards[state.gridSize.toString()] || standards['5'];
            
            if (seconds <= std.excellent && errors === 0) {
                return { 
                    label: '卓越', 
                    color: '#fbbf24',
                    badge: '🏆 金牌',
                    badgeClass: 'gold'
                };
            } else if (seconds <= std.excellent) {
                return { 
                    label: '优秀', 
                    color: '#10b981',
                    badge: '🥇 金牌',
                    badgeClass: 'gold'
                };
            } else if (seconds <= std.good) {
                return { 
                    label: '良好', 
                    color: '#6366f1',
                    badge: '🥈 银牌',
                    badgeClass: 'silver'
                };
            } else if (seconds <= std.average) {
                return { 
                    label: '中等', 
                    color: '#8b5cf6' 
                };
            } else {
                return { 
                    label: '加���', 
                    color: '#94a3b8' 
                };
            }
        }

        // 计时器更新
        function updateTimer() {
            const elapsed = Date.now() - state.startTime;
            elements.timer.textContent = formatTime(elapsed);
        }

        // 格式化时间
        function formatTime(ms) {
            const totalSeconds = ms / 1000;
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = Math.floor(totalSeconds % 60);
            const milliseconds = Math.floor(ms % 1000);
            
            return String(minutes).padStart(2, '0') + ':' + 
                   String(seconds).padStart(2, '0') + '.' + 
                   String(milliseconds).padStart(3, '0');
        }

        // 更新当前数字显示
        function updateCurrentDisplay() {
            if (state.mode === 'letter') {
                elements.currentNum.textContent = state.currentNumber > state.totalNumbers 
                    ? '完成' 
                    : state.letters[state.currentNumber - 1];
            } else {
                elements.currentNum.textContent = state.currentNumber > state.totalNumbers 
                    ? '完成' 
                    : state.currentNumber;
            }
        }

        // 更新错误显示
        function updateErrorsDisplay() {
            elements.errors.textContent = state.errors;
        }

        // 历史记录 - 保存
        function saveHistory(time, errors, elapsedMs) {
            const record = {
                time: time,
                errors: errors,
                elapsed: elapsedMs,
                size: state.gridSize,
                mode: state.mode,
                date: new Date().toISOString()
            };
            
            state.history.unshift(record);
            
            // 最多保存50条
            if (state.history.length > 50) {
                state.history = state.history.slice(0, 50);
            }
            
            try {
                localStorage.setItem('schulte-history', JSON.stringify(state.history));
            } catch (e) {}
            updateHistoryDisplay();
        }

        // 历史记录 - 加载
        function loadHistory() {
            try {
                const saved = localStorage.getItem('schulte-history');
                if (saved) {
                    state.history = JSON.parse(saved);
                }
            } catch (e) {
                state.history = [];
            }
        }

        // 历史记录 - 显示
        function updateHistoryDisplay() {
            if (state.history.length === 0) {
                elements.historyList.innerHTML = '<div class="history-empty">暂无训练记录</div>';
                return;
            }
            
            elements.historyList.innerHTML = state.history.map((record, index) => 
                '<div class="history-item">' +
                    '<div class="history-info">' +
                        '<span class="history-size">' + record.size + '×' + record.size + '</span>' +
                        '<span class="history-time">' + record.time + '</span>' +
                    '</div>' +
                    '<span class="history-errors">' + record.errors + '次错误</span>' +
                '</div>'
            ).join('');
        }

        // 历史记录 - 清空
        function clearHistory() {
            if (confirm('确定要清空所有历史记录吗？')) {
                state.history = [];
                try {
                    localStorage.removeItem('schulte-history');
                } catch (e) {}
                updateHistoryDisplay();
            }
        }

        // 启动
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
